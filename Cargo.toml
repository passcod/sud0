[package]
name = "sud0"
version = "0.1.0"
edition = "2024"
description = "A polkit-authorized root command runner"
license = "MIT OR Apache-2.0"
repository = "https://github.com/passcod/sud0"
homepage = "https://github.com/passcod/sud0"
readme = "README.md"
rust-version = "1.89"
publish = false
default-run = "sud0"

[lib]
name = "sud0"
path = "src/lib.rs"

[[bin]]
name = "sud0"
path = "src/main.rs"

[[bin]]
name = "sud0-broker"
path = "src/bin/sud0-broker.rs"

[[bin]]
name = "sud0-exec"
path = "src/bin/sud0-exec.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
getrandom = "0.4.3"
hex = "0.4.3"
libc = "0.2.190"
nix = { version = "0.31.3", features = ["fs", "process", "signal", "socket", "term", "user", "poll"] }
rustix = { version = "1.1.5", features = ["termios"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "signal", "io-util", "process", "time", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zbus = { version = "5.19.0", features = ["tokio"] }

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"
